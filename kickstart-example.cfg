#version=RHEL8
# Example Kickstart for RHEL 8.3 (installs from the DVD the installer booted from)
# Validate with: ksvalidator rhel8.cfg

# --- Install source ---
cdrom

# --- Installer mode ---
text
firstboot --disable
eula --agreed

# --- Localization ---
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Africa/Cairo --isUtc

# --- Network ---
network --bootproto=dhcp --device=link --activate --onboot=yes
network --hostname=rhel8-host.example.com

# --- Users ---
# Generate a hash with: python3 -c 'import crypt; print(crypt.crypt("YourPassword", crypt.mksalt(crypt.METHOD_SHA512)))'
rootpw --iscrypted $6$REPLACE_WITH_YOUR_HASH
user --name=admin --groups=wheel --iscrypted --password=$6$REPLACE_WITH_YOUR_HASH

# --- Security ---
authselect --useshadow --passalgo=sha512
selinux --enforcing
firewall --enabled --service=ssh

# --- Disk layout ---
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda
bootloader --location=mbr --boot-drive=sda

# For UEFI systems, add this partition and keep the others:
# part /boot/efi --fstype=efi --size=600 --ondisk=sda

part /boot --fstype=xfs --size=1024
part pv.01 --size=1 --grow

volgroup vg_sys pv.01
logvol /     --vgname=vg_sys --name=lv_root --fstype=xfs  --size=20480
logvol /var  --vgname=vg_sys --name=lv_var  --fstype=xfs  --size=10240
logvol swap  --vgname=vg_sys --name=lv_swap --fstype=swap --size=4096

# --- Services ---
services --enabled=sshd,chronyd

# --- Packages ---
%packages
@^minimal-environment
chrony
vim-enhanced
wget
curl
net-tools
bash-completion
-iwl*firmware
%end

# --- Post-install ---
%post --log=/root/ks-post.log
# Allow wheel group sudo without password (adjust to your policy)
echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
chmod 440 /etc/sudoers.d/wheel

# Harden SSH: no root login
sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config

# Register with Red Hat (uncomment and fill in)
# subscription-manager register --org=YOUR_ORG --activationkey=YOUR_KEY
%end

# --- Finish ---
reboot --eject